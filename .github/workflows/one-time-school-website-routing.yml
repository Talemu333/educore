name: One-time school website URL migration

on:
  push:
    branches:
      - multischool-migration

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[school-web-routing]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply school-specific public website routes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('educore-frontend/src')

          # 1. Add a small public redirect component for legacy /website/* URLs.
          redirect = root / 'pages/public/LegacyWebsiteRedirect.jsx'
          redirect.parent.mkdir(parents=True, exist_ok=True)
          redirect.write_text(r'''import { useEffect } from "react";
import { useNavigate, useLocation } from "react-router-dom";
import { useSchoolSettings } from "@/hooks/useSchoolSettings";

const LEGACY_TO_SLUG = {
    "": "home",
    home: "home",
    about: "about",
    academics: "academics",
    admissions: "admissions",
    contact: "contact",
    gallery: "gallery",
    news: "news",
    events: "events"
};

function LegacyWebsiteRedirect() {
    const navigate = useNavigate();
    const location = useLocation();
    const { data: settings, isLoading } = useSchoolSettings();

    useEffect(() => {
        if (isLoading) return;

        const parts = location.pathname
            .split("/")
            .filter(Boolean);

        const legacyPage = parts[1] || "";
        const slug = LEGACY_TO_SLUG[legacyPage] || "home";
        const schoolSlug = settings?.website_slug;

        if (schoolSlug) {
            navigate(`/${schoolSlug}/${slug}`, { replace: true });
        }
    }, [isLoading, location.pathname, navigate, settings?.website_slug]);

    return (
        <div className="flex min-h-[60vh] items-center justify-center px-6">
            <p className="text-sm text-slate-500">Loading school website...</p>
        </div>
    );
}

export default LegacyWebsiteRedirect;
''', encoding='utf-8')

          # 2. Replace the old public route group in AppRouter with school-slug routes.
          router = root / 'routes/AppRouter.jsx'
          text = router.read_text(encoding='utf-8')

          import_anchor = 'import PublicLayout\n    from "@/layouts/PublicLayout";'
          if 'LegacyWebsiteRedirect' not in text:
              text = text.replace(
                  import_anchor,
                  import_anchor + '\n\nimport LegacyWebsiteRedirect\n    from "@/pages/public/LegacyWebsiteRedirect";'
              )

          start = text.find('                <Route\n                    path="/website"')
          if start == -1:
              start = text.find('                <Route path="/website"')
          if start == -1:
              raise SystemExit('Could not find legacy public website route in AppRouter.jsx')

          # Find the matching outer Route by counting Route open/close tags.
          pos = start
          depth = 0
          end = None
          route_open = re.compile(r'<Route\b')
          route_close = re.compile(r'</Route>')
          while pos < len(text):
              om = route_open.search(text, pos)
              cm = route_close.search(text, pos)
              if cm is None:
                  break
              if om is not None and om.start() < cm.start():
                  depth += 1
                  pos = om.end()
              else:
                  depth -= 1
                  pos = cm.end()
                  if depth == 0:
                      end = pos
                      break
          if end is None:
              raise SystemExit('Could not determine end of legacy public website route')

          replacement = '''                {/* =========================================
                    SCHOOL-SPECIFIC PUBLIC WEBSITES
                ========================================= */}

                <Route
                    path="/:schoolSlug"
                    element={<PublicLayout />}
                >
                    <Route
                        path="home"
                        element={<Home />}
                    />
                    <Route
                        index
                        element={<Home />}
                    />
                    <Route
                        path="about"
                        element={<About />}
                    />
                    <Route
                        path="contact"
                        element={<Contact />}
                    />
                    <Route
                        path="academics"
                        element={<Academics />}
                    />
                    <Route
                        path="admissions"
                        element={<Admissions />}
                    />
                    <Route
                        path="gallery"
                        element={<Gallery />}
                    />
                    <Route
                        path="news"
                        element={<News />}
                    />
                    <Route
                        path="news/:slug"
                        element={<NewsDetails />}
                    />
                    <Route
                        path="events"
                        element={<Events />}
                    />
                    <Route
                        path="events/:slug"
                        element={<EventDetails />}
                    />
                </Route>

                {/* Legacy URLs redirect to the current school's canonical URL. */}
                <Route
                    path="/website/*"
                    element={<LegacyWebsiteRedirect />}
                />
'''
          text = text[:start] + replacement + text[end:]
          router.write_text(text, encoding='utf-8')

          # 3. Make PublicLayout navigation use the current school slug.
          layout = root / 'layouts/PublicLayout.jsx'
          text = layout.read_text(encoding='utf-8')
          nav_old = '''const NAVIGATION = [

    {
        label: "Home",
        path: "/website"
    },

    {
        label: "About",
        path: "/website/about"
    },

    {
        label: "Academics",
        path: "/website/academics"
    },

    {
        label: "Admissions",
        path: "/website/admissions"
    },

    {
        label: "News",
        path: "/website/news"
    },

    {
        label: "Gallery",
        path: "/website/gallery"
    },

    {
        label: "Events",
        path: "/website/events"
    },

    {
        label: "Contact",
        path: "/website/contact"
    }

];'''
          nav_new = '''const getSchoolSlug = () =>
    window.location.pathname
        .split("/")
        .filter(Boolean)[0] || "";

function getNavigation(schoolSlug) {
    const base = `/${schoolSlug}`;

    return [
        { label: "Home", path: `${base}/home` },
        { label: "About", path: `${base}/about` },
        { label: "Academics", path: `${base}/academics` },
        { label: "Admissions", path: `${base}/admissions` },
        { label: "News", path: `${base}/news` },
        { label: "Gallery", path: `${base}/gallery` },
        { label: "Events", path: `${base}/events` },
        { label: "Contact", path: `${base}/contact` }
    ];
}'''
          if nav_old not in text:
              raise SystemExit('Could not find PublicLayout navigation block')
          text = text.replace(nav_old, nav_new)
          text = text.replace('function PublicLayout() {\n', 'function PublicLayout() {\n\n    const schoolSlug = getSchoolSlug();\n    const NAVIGATION = getNavigation(schoolSlug);\n\n')
          text = text.replace('end={\n                                        item.path ===\n                                        "/website"\n                                    }', 'end={item.path === `/${schoolSlug}/home`}')
          text = text.replace('end={\n                                                item.path ===\n                                                "/website"\n                                            }', 'end={item.path === `/${schoolSlug}/home`}')
          text = text.replace('to="/website"', 'to={`/${schoolSlug}/home`}')
          text = text.replace('to="/website/admissions"', 'to={`/${schoolSlug}/admissions`}')
          layout.write_text(text, encoding='utf-8')

          # 4. Make the home-page discovery link canonical.
          home = root / 'pages/public/Home.jsx'
          text = home.read_text(encoding='utf-8')
          text = text.replace('function Home() {\n', 'function Home() {\n\n    const schoolSlug = window.location.pathname.split("/").filter(Boolean)[0] || "";\n')
          text = text.replace('to="/website/about"', 'to={`/${schoolSlug}/about`}')
          home.write_text(text, encoding='utf-8')

          # 5. Make website management previews point directly at the school's website.
          management = root / 'pages/dashboard/WebsiteManagement.jsx'
          text = management.read_text(encoding='utf-8')
          settings_import = 'import Loading from "@/components/common/Loading";'
          if 'useSchoolSettings' not in text:
              text = text.replace(
                  settings_import,
                  settings_import + '\nimport { useSchoolSettings } from "@/hooks/useSchoolSettings";'
              )
          marker = '    const [\n        selectedManagementTab,'
          if marker in text and 'const { data: schoolSettings } = useSchoolSettings();' not in text:
              text = text.replace(marker, '    const { data: schoolSettings } = useSchoolSettings();\n\n' + marker)
          text = text.replace('path: "/website"', 'path: "/website"')
          old_preview = '''        window.open(
            pageOption.path,
            "_blank",
            "noopener,noreferrer"
        );'''
          new_preview = '''        const schoolSlug = schoolSettings?.website_slug || `school-${schoolSettings?.school_id}`;

        if (!schoolSlug) {
            toast.error("School website URL could not be determined.");
            return;
        }

        window.open(
            `/${schoolSlug}/${pageOption.slug}`,
            "_blank",
            "noopener,noreferrer"
        );'''
          if old_preview in text:
              text = text.replace(old_preview, new_preview)
          management.write_text(text, encoding='utf-8')

          print('School-specific website routing migration applied.')
      
      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-school-website-routing.yml
          git add educore-frontend/src .github/workflows/one-time-school-website-routing.yml
          git commit -m "feat: use school-specific website URLs [school-web-routing]"
          git push origin HEAD:multischool-migration
