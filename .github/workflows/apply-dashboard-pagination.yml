name: Apply dashboard pagination

on:
  push:
    branches:
      - multischool-migration

permissions:
  contents: write

jobs:
  apply-pagination:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: multischool-migration
          fetch-depth: 0

      - name: Apply pagination
        shell: python
        run: |
          from pathlib import Path

          parent_path = Path("educore-frontend/src/pages/admin/ParentFinancialOverviewPage.jsx")
          payment_path = Path("educore-frontend/src/pages/payments/PaymentReportsPage.jsx")

          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit(f"Missing {label} anchor")

          def insert_after_once(text, needle, insertion, label):
              if insertion.strip() in text:
                  return text
              require(text, needle, label)
              return text.replace(needle, needle + insertion, 1)

          # Parent Financial Overview
          text = parent_path.read_text(encoding="utf-8")
          if "PARENT_PAGE_SIZE" not in text:
              text = insert_after_once(
                  text,
                  'import { Button } from "@/components/ui/Button";',
                  '\n\nimport Pagination from "@/components/common/Pagination";',
                  "parent Pagination import",
              )

              state_anchor = '''    const [
        statusFilter,
        setStatusFilter
    ] = useState("ALL");'''
              state_insert = '''

    const [
        parentPage,
        setParentPage
    ] = useState(1);

    const PARENT_PAGE_SIZE = 10;'''
              text = insert_after_once(text, state_anchor, state_insert, "parent pagination state")

              totals_anchor = '''    /*
    |--------------------------------------------------------------------------
    | TOTALS
    |--------------------------------------------------------------------------
    */'''
              logic = '''

    /*
    |--------------------------------------------------------------------------
    | PAGINATION
    |--------------------------------------------------------------------------
    */

    const parentTotalPages = Math.max(
        1,
        Math.ceil(
            filteredParents.length /
            PARENT_PAGE_SIZE
        )
    );

    const paginatedParents = useMemo(() => {
        const start =
            (parentPage - 1) *
            PARENT_PAGE_SIZE;

        return filteredParents.slice(
            start,
            start + PARENT_PAGE_SIZE
        );
    }, [
        filteredParents,
        parentPage
    ]);

    useEffect(() => {
        setParentPage(1);
    }, [
        selectedSessionId,
        selectedTermId,
        search,
        statusFilter
    ]);

    useEffect(() => {
        if (parentPage > parentTotalPages) {
            setParentPage(parentTotalPages);
        }
    }, [
        parentPage,
        parentTotalPages
    ]);

'''
              text = insert_after_once(text, totals_anchor, logic, "parent pagination logic")
              require(text, "filteredParents.map(", "parent table map")
              text = text.replace("filteredParents.map(", "paginatedParents.map(", 1)

              map_pos = text.find("paginatedParents.map(")
              table_end = text.find("</table>", map_pos)
              if table_end == -1:
                  raise SystemExit("Missing parent table closing tag")

              markup = '''</table>

                    <Pagination
                        page={parentPage}
                        totalPages={parentTotalPages}
                        total={filteredParents.length}
                        limit={PARENT_PAGE_SIZE}
                        onPageChange={setParentPage}
                        disabled={isFetching}
                    />'''
              text = text[:table_end] + markup + text[table_end + len("</table>"):]
              parent_path.write_text(text, encoding="utf-8")

          # Payment Reports
          text = payment_path.read_text(encoding="utf-8")
          if "REPORT_PAGE_SIZE" not in text:
              text = insert_after_once(
                  text,
                  'import Loading from "@/components/common/Loading";',
                  '\n\nimport Pagination from "@/components/common/Pagination";',
                  "payment Pagination import",
              )

              search_anchor = '''    const [
        search,
        setSearch
    ] = useState("");'''
              search_insert = '''

    const [
        reportPage,
        setReportPage
    ] = useState(1);

    const REPORT_PAGE_SIZE = 10;'''
              text = insert_after_once(text, search_anchor, search_insert, "payment pagination state")

              report_anchor = '''    const summary =
        reportData?.summary || {};'''
              logic = '''

    const reportTotalPages = Math.max(
        1,
        Math.ceil(
            report.length /
            REPORT_PAGE_SIZE
        )
    );

    const paginatedReport = useMemo(() => {
        const start =
            (reportPage - 1) *
            REPORT_PAGE_SIZE;

        return report.slice(
            start,
            start + REPORT_PAGE_SIZE
        );
    }, [
        report,
        reportPage
    ]);

    useEffect(() => {
        setReportPage(1);
    }, [
        sessionId,
        termId,
        classId,
        paymentMethod,
        dateFrom,
        dateTo,
        search
    ]);

    useEffect(() => {
        if (reportPage > reportTotalPages) {
            setReportPage(reportTotalPages);
        }
    }, [
        reportPage,
        reportTotalPages
    ]);
'''
              text = insert_after_once(text, report_anchor, logic, "payment pagination logic")
              require(text, "report.map(", "payment report table map")
              text = text.replace("report.map(", "paginatedReport.map(", 1)

              map_pos = text.find("paginatedReport.map(")
              table_end = text.find("</table>", map_pos)
              if table_end == -1:
                  raise SystemExit("Missing payment table closing tag")

              markup = '''</table>

                                <Pagination
                                    page={reportPage}
                                    totalPages={reportTotalPages}
                                    total={report.length}
                                    limit={REPORT_PAGE_SIZE}
                                    onPageChange={setReportPage}
                                    disabled={isReportLoading}
                                />'''
              text = text[:table_end] + markup + text[table_end + len("</table>"):]
              payment_path.write_text(text, encoding="utf-8")

          print("Dashboard pagination applied.")

      - name: Validate changes
        working-directory: educore-frontend
        run: |
          npm ci
          npm run build

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-dashboard-pagination.yml
          git add educore-frontend/src/pages/admin/ParentFinancialOverviewPage.jsx educore-frontend/src/pages/payments/PaymentReportsPage.jsx
          git commit -m "Add pagination to financial dashboard tables"
          git push origin multischool-migration
